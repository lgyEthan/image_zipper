[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pictumi"
version = "0.1.7"
description = "Offline image and PDF compression with a measurable resolution budget"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow==13.0.0",
  "pillow-heif==1.8.1",
  "pikepdf==10.17.0",
  "pypdfium2==5.14.0",
  "img2pdf==0.6.3",
  "PySide6-Essentials==6.12.0",
  "pyoxipng==9.1.1",
  "pyjpegli==0.3.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "pyinstaller==6.22.3"]

[project.gui-scripts]
pictumi = "pictumi.app:main"

[project.scripts]
pictumi-cli = "pictumi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pictumi = ["assets/*.svg", "assets/*.heic", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.spec" = ["F821"]  # PyInstaller supplies Analysis, PYZ, EXE, COLLECT, BUNDLE, and SPECPATH.

