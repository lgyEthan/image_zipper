name: Test and build desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows-x64
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install PDF build headers on Intel Mac
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          brew install qpdf
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix qpdf)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix qpdf)/lib" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qpdf)" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts packaging
      - name: Test
        run: python -m pytest -q
      - name: Freeze, verify bundled codecs, and package
        run: python scripts/build.py
      - name: Upload desktop app
        uses: actions/upload-artifact@v4
        with:
          name: ImageZipper-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/self-test.json
            build/ImageZipper/warn-ImageZipper.txt
          if-no-files-found: ignore
